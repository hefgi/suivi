[package]
name = "suivi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Track time spent working with AI coding agents"
license = "MIT"
repository = "https://github.com/hefgi/suivi"
homepage = "https://hefgi.github.io/suivi"
documentation = "https://hefgi.github.io/suivi"
keywords = ["time-tracking", "ai", "developer-tools", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
colored = "2"
rusqlite = { version = "0.35", features = ["bundled"] }
dirs = "6"
glob = "0.3"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
